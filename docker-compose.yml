# 一键部署：docker compose up -d --build
# 首次启动后执行一次种子数据：docker compose exec seed ./app
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-petshop123}
      MYSQL_DATABASE: petshop
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  service:
    build:
      context: .
      args:
        TARGET: service
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-petshop123}@tcp(mysql:3306)/petshop?charset=utf8mb4&parseTime=True&loc=Local
      RPC_ADDR: ":9001"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9001:9001"

  gateway:
    build:
      context: .
      args:
        TARGET: gateway
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-petshop123}@tcp(mysql:3306)/petshop?charset=utf8mb4&parseTime=True&loc=Local
      RPC_HOSTPORT: service:9001
      HTTP_ADDR: ":8081"
      GATEWAY_URL: http://gateway:8081
    depends_on:
      - service
    ports:
      - "8081:8081"

  paysim:
    build:
      context: .
      args:
        TARGET: paysim
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-petshop123}@tcp(mysql:3306)/petshop?charset=utf8mb4&parseTime=True&loc=Local
      BIZ_CALLBACK: http://gateway:8081
      PAY_ADDR: ":9002"
    depends_on:
      - service
    ports:
      - "9002:9002"

  seed:
    build:
      context: .
      args:
        TARGET: seed
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-petshop123}@tcp(mysql:3306)/petshop?charset=utf8mb4&parseTime=True&loc=Local
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - tools

volumes:
  mysqldata:
